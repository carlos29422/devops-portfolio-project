# ==============================================================================
# GitLab CI/CD Pipeline - DevSecOps Quality, Build, Security, CD & Observability
# ==============================================================================

default:
  image: alpine:3.19

stages:
  - lint
  - build
  - security
  - deploy
  - post-deploy

# -----------------------------------------------------------------------------
# STAGE 1: Linting & Análisis Estático
# -----------------------------------------------------------------------------

lint:bash:
  stage: lint
  image: koalaman/shellcheck-alpine:v0.9.0
  script:
    - echo "Iniciando análisis estático de scripts Bash..."
    - shellcheck scripts/*.sh

lint:dockerfile:
  stage: lint
  image: hadolint/hadolint:latest-alpine
  script:
    - echo "Iniciando análisis de seguridad del Dockerfile..."
    - hadolint --ignore DL3008 --ignore DL3025 app/Dockerfile

lint:python:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install --no-cache-dir flake8
  script:
    - echo "Iniciando análisis estático del código Python..."
    - flake8 app/main.py --max-line-length=120 --ignore=E501,W503,W292

lint:terraform:
  stage: lint
  image:
    name: hashicorp/terraform:1.5.7
    entrypoint: [""]
  script:
    - echo "Verificando formato y sintaxis de Terraform..."
    - cd terraform
    - terraform fmt -check
    - terraform init -backend=false
    - terraform validate

lint:helm:
  stage: lint
  image:
    name: alpine/helm:3.14.0
    entrypoint: [""]
  script:
    - echo "Validando sintaxis del Helm Chart..."
    - helm lint helm/portfolio-api/

# -----------------------------------------------------------------------------
# STAGE 2: Build & Push a GitLab Container Registry
# -----------------------------------------------------------------------------

build:docker:
  stage: build
  image: docker:24.0.7
  services:
    - name: docker:24.0.7-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - echo "Compilando la imagen de Docker..."
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA -t $CI_REGISTRY_IMAGE:latest ./app
    - echo "Publicando imágenes en GitLab Container Registry..."
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest

# -----------------------------------------------------------------------------
# STAGE 3: Security - Escaneo de Vulnerabilidades e IaC Audit
# -----------------------------------------------------------------------------

security:trivy-container:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  before_script:
    - trivy registry login --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - echo "Iniciando escaneo CVE en la imagen $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA..."
    - trivy image --severity HIGH,CRITICAL $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

security:iac-scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - echo "Iniciando análisis estático de seguridad en código IaC (Terraform y K8s)..."
    - trivy config terraform/
    - trivy config k8s/

# -----------------------------------------------------------------------------
# STAGE 4: Continuous Deployment (CD) - Simulation & Helm Render
# -----------------------------------------------------------------------------

deploy:staging:
  stage: deploy
  image:
    name: alpine/helm:3.14.0
    entrypoint: [""]
  script:
    - echo "Simulando despliegue de Helm en entorno Staging/Dev..."
    - helm template portfolio-api-dev helm/portfolio-api/ -f helm/portfolio-api/values-dev.yaml --set image.tag=$CI_COMMIT_SHA

deploy:production:
  stage: deploy
  image:
    name: alpine/helm:3.14.0
    entrypoint: [""]
  script:
    - echo "Simulando renderizado de manifiestos para entorno Producción..."
    - helm template portfolio-api-prod helm/portfolio-api/ -f helm/portfolio-api/values-prod.yaml --set image.tag=$CI_COMMIT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# -----------------------------------------------------------------------------
# STAGE 5: Post-Deploy Smoke Tests & Observability
# -----------------------------------------------------------------------------

smoke-test:metrics:
  stage: post-deploy
  image:
    name: alpine/helm:3.14.0
    entrypoint: [""]
  script:
    - echo "Validando estructura de manifiestos y sintaxis de endpoints de observabilidad..."
    - 'helm template test-release helm/portfolio-api/ | grep "prometheus.io/scrape"'
    - echo "Verificación de métricas en manifiestos de Helm completada con éxito."
