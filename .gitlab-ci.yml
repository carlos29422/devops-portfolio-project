# ==============================================================================
# GitLab CI/CD Pipeline - DevSecOps Quality, Build & Security Audit
# ==============================================================================

default:
  image: alpine:3.19

stages:
  - lint
  - build
  - security

# -----------------------------------------------------------------------------
# STAGE 1: Linting & Análisis Estático
# -----------------------------------------------------------------------------

lint:bash:
  stage: lint
  image: koalaman/shellcheck-alpine:v0.9.0
  script:
    - echo "Iniciando análisis estático de scripts Bash..."
    - shellcheck scripts/*.sh

lint:dockerfile:
  stage: lint
  image: hadolint/hadolint:latest-alpine
  script:
    - echo "Iniciando análisis de seguridad del Dockerfile..."
    - hadolint --ignore DL3008 --ignore DL3025 app/Dockerfile

lint:python:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install --no-cache-dir flake8
  script:
    - echo "Iniciando análisis estático del código Python..."
    - flake8 app/main.py --max-line-length=120 --ignore=E501,W503,W292

# -----------------------------------------------------------------------------
# STAGE 2: Build & Push a GitLab Container Registry
# -----------------------------------------------------------------------------

build:docker:
  stage: build
  image: docker:24.0.7
  services:
    - name: docker:24.0.7-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - echo "Compilando la imagen de Docker..."
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA -t $CI_REGISTRY_IMAGE:latest ./app
    - echo "Publicando imágenes en GitLab Container Registry..."
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest

# -----------------------------------------------------------------------------
# STAGE 3: Security - Escaneo de Vulnerabilidades (Trivy Container Scan)
# -----------------------------------------------------------------------------

security:trivy:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  before_script:
    # Autenticación para descargar la imagen privada del Container Registry
    - trivy registry login --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - echo "Iniciando escaneo de seguridad CVE en la imagen $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA..."
    # Muestra reporte en consola de vulnerabilidades HIGH y CRITICAL
    - trivy image --severity HIGH,CRITICAL $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA