apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "portfolio-api.fullname" . }}-config
  labels:
    {{- include "portfolio-api.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.env.environment | quote }}
  PORT: {{ .Values.env.port | quote }}
  LOG_LEVEL: {{ .Values.env.logLevel | quote }}